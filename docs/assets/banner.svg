<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">KutayOS</title>
  <desc id="d">KutayOS: a quiet, fast Windows 11 LTSC 2024 that doesn't break.</desc>
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .fg { fill: #1f2328; }
    .mute { fill: #59636e; }
    .accent { fill: #0969da; }
    .line { stroke: #1f2328; }
    .pill { fill: #ffffff; stroke: #d1d9e0; }
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .fg { fill: #f0f6fc; }
      .mute { fill: #9198a1; }
      .accent { fill: #4493f8; }
      .line { stroke: #f0f6fc; }
      .pill { fill: #0d1117; stroke: #3d444d; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="318" rx="24" stroke-width="2"/>

  <!-- Icon: a window whose contents are three sliders (configure, don't remove) -->
  <g transform="translate(90 80)">
    <rect class="accent" x="0" y="0" width="160" height="160" rx="32"/>
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="36" y1="50" x2="124" y2="50"/>
      <line x1="36" y1="80" x2="124" y2="80"/>
      <line x1="36" y1="110" x2="124" y2="110"/>
    </g>
    <g fill="#ffffff">
      <circle cx="98" cy="50" r="13"/>
      <circle cx="58" cy="80" r="13"/>
      <circle cx="84" cy="110" r="13"/>
    </g>
  </g>

  <text class="fg" x="300" y="148" font-size="68" font-weight="700">KutayOS</text>
  <text class="mute" x="302" y="198" font-size="27">A quiet, fast Windows 11 LTSC 2024 that doesn't break.</text>

  <g font-size="18" text-anchor="middle">
    <rect class="pill" x="300" y="228" width="370" height="40" rx="20" stroke-width="1.5"/>
    <text class="fg" x="485" y="254">Windows 11 IoT Enterprise LTSC 2024</text>
    <rect class="pill" x="684" y="228" width="210" height="40" rx="20" stroke-width="1.5"/>
    <text class="fg" x="789" y="254">AME Wizard playbook</text>
    <rect class="pill" x="908" y="228" width="190" height="40" rx="20" stroke-width="1.5"/>
    <text class="fg" x="1003" y="254">GPL-3.0-or-later</text>
  </g>
</svg>
