---
title: KutayOS Root
description: Entry point, runs every KutayOS task in order
actions:
  - !writeStatus: {status: 'Preparing KutayOS'}
  - !powerShell:
    command: '.\KutayModules\Initialize-Kutay.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated
    handleExitCodes: {"!0": halt}

  # No restore point, no changes: the script exits 1 and AME halts.
  - !writeStatus: {status: 'Creating a restore point'}
  - !powerShell:
    command: '.\KutayModules\New-KutayRestorePoint.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated
    handleExitCodes: {"!0": halt}

  # Right after the restore point and before any tweak: a failed download or signature check halts
  # here, while almost nothing has been changed.
  - !writeStatus: {status: 'Installing winget and Windows Terminal'}
  - !task: {path: 'tweaks\setup\install-winget-terminal.yml'}

  - !writeStatus: {status: 'Applying privacy settings'}
  - !task: {path: 'tweaks\privacy\disable-telemetry.yml'}
  - !task: {path: 'tweaks\privacy\disable-app-telemetry.yml'}
  - !task: {path: 'tweaks\privacy\disable-ceip.yml'}
  - !task: {path: 'tweaks\privacy\disable-ceip-tasks.yml'}
  - !task: {path: 'tweaks\privacy\disable-feedback-prompts.yml'}
  - !task: {path: 'tweaks\privacy\disable-inking-typing-data.yml'}
  - !task: {path: 'tweaks\privacy\disable-activity-history.yml'}
  - !task: {path: 'tweaks\privacy\disable-advertising-id.yml'}

  - !writeStatus: {status: 'Turning off suggestions and consumer content'}
  - !task: {path: 'tweaks\privacy\disable-consumer-features.yml'}
  - !task: {path: 'tweaks\privacy\disable-cloud-optimized-content.yml'}
  - !task: {path: 'tweaks\privacy\disable-windows-tips.yml'}
  - !task: {path: 'tweaks\privacy\disable-search-highlights.yml'}
  - !task: {path: 'tweaks\privacy\disable-tailored-experiences.yml'}
  - !task: {path: 'tweaks\privacy\disable-third-party-suggestions.yml'}
  - !task: {path: 'tweaks\privacy\disable-start-web-search.yml'}

  - !writeStatus: {status: 'Tidying up the taskbar and File Explorer'}
  - !task: {path: 'tweaks\shell\hide-taskbar-search.yml'}
  - !task: {path: 'tweaks\shell\hide-task-view-button.yml'}
  - !task: {path: 'tweaks\shell\show-file-extensions.yml'}
  - !task: {path: 'tweaks\shell\enable-end-task.yml'}
  # Options from the FeaturePages in playbook.conf; each action inside checks its own option.
  - !task: {path: 'tweaks\shell\taskbar-align-left.yml'}
  - !task: {path: 'tweaks\shell\dark-mode.yml'}
  - !task: {path: 'tweaks\shell\classic-context-menu.yml'}
  - !task: {path: 'tweaks\shell\hide-explorer-home-gallery.yml'}
  - !task: {path: 'tweaks\shell\hide-start-recommended.yml'}

  - !writeStatus: {status: 'Reducing background work'}
  - !task: {path: 'tweaks\performance\disable-edge-background.yml'}
  - !task: {path: 'tweaks\performance\disable-diagtrack-service.yml'}

  # Cleanup before Compact OS, so the removed component versions are not compressed first.
  - !writeStatus: {status: 'Freeing disk space, this can take several minutes'}
  - !task: {path: 'tweaks\storage\disable-hibernation.yml'}
  - !task: {path: 'tweaks\storage\disable-reserved-storage.yml'}
  - !task: {path: 'tweaks\storage\component-cleanup.yml'}
  - !task: {path: 'tweaks\storage\compact-os.yml'}
