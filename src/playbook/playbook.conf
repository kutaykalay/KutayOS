<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>KutayOS</Name>
	<Username>KutayOS</Username>
	<Title>KutayOS v0.9.0</Title>
	<ShortDescription>A quiet, fast and tidy Windows 11 IoT Enterprise LTSC 2024 that keeps updates, security and apps working</ShortDescription>
	<Description><![CDATA[KutayOS tunes Windows 11 IoT Enterprise LTSC 2024 for everyday use: less background work, no ads or suggestions, a tidy desktop and a smaller disk footprint. It configures Windows with documented policies and settings and removes nothing.

A System Restore point is created and current values are saved before any change, and every change can be reverted. Windows Update, Defender, search and apps keep working. Anti-cheat requirements (Secure Boot, TPM, driver signing) are never touched.]]></Description>
	<Details>Open source Windows modification for LTSC 2024.</Details>
	<ProgressText><![CDATA[KutayOS is configuring Windows. Do not turn off your computer.]]></ProgressText>
	<Version>0.9.0</Version>
	<SupportedBuilds>
		<!-- LTSC 2024 (24H2) -->
		<string>26100</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>e2992e51-d257-435c-a13b-a40488a333cd</UniqueId>
	<Overhaul>false</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>15</EstimatedMinutes>
	<!-- Options: names match the option: of tweak actions. AME allows at most 4 per CheckboxPage. -->
	<FeaturePages>
		<CheckboxPage Description="LTSC has no Microsoft Store. This adds the two tools most people expect. It downloads about 360 MB from Microsoft, so the PC needs internet; without it the run stops before anything else is changed, so untick this to install offline.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Name>install-winget-terminal</Name>
					<Text>Install winget and Windows Terminal, and keep Terminal updated</Text>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Pick the look you prefer. Everything else stays as Windows has it.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Name>taskbar-align-left</Name>
					<Text>Taskbar on the left, like Windows 10</Text>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Name>dark-mode</Name>
					<Text>Dark mode</Text>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Name>classic-context-menu</Name>
					<Text>Classic right-click menu, without "Show more options"</Text>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Name>hide-explorer-home-gallery</Name>
					<Text>File Explorer opens to This PC, no Home and Gallery</Text>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Locked settings: Windows Settings can't change these back, only the KutayOS revert script.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Name>hide-start-recommended</Name>
					<Text>Start menu without the Recommended section</Text>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="More disk space. Old update files are always cleaned up; these free more, each with a trade-off.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Name>disable-hibernation</Name>
					<Text>Turn off hibernation (no Hibernate or Fast Startup)</Text>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Name>compact-os</Name>
					<Text>Compress Windows files (a few GB, slightly slower on old PCs)</Text>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Name>disable-reserved-storage</Name>
					<Text>Free the space kept for updates (updates may fail on a full disk)</Text>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
